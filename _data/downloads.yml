    en: "From the article “The Milky Way's invisible companions: Rubin discovers a ghost galaxy adrift in the dark and a star cluster buried in dust”. For personal and educational use, with credit to Redshifted. Reference image: NSF–DOE Vera C. Rubin Observatory/NOIRLab/SLAC/AURA, ESA/Gaia/DPAC, W. Cerny. Not affiliated with the Rubin Observatory."
