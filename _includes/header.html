<header class="site-header">
  <a class="brand" href="{{ '/' | append: lang | append: '/' | relative_url }}">
    <span class="icon-star"><img src="{{ '/assets/img/logo.jpg' | relative_url }}" alt="Redshifted" width="68" height="68"></span>
    <img class="title-image" src="{{ '/assets/img/logo-titolo-dark.png' | relative_url }}" alt="Redshifted - Personal Astronomy &amp; Astrophysics Journal" width="300" height="80">
  </a>

  <nav class="main-nav" aria-label="Menu">
    <a href="{{ '/' | append: lang | append: '/' | relative_url }}"{% if page.url == '/it/' or page.url == '/en/' %} class="active" aria-current="page"{% endif %}><i class="fas fa-home" aria-hidden="true"></i> {{ t.nav.home }}</a>
    <a href="{{ '/' | append: lang | append: '/journal/' | relative_url }}"{% if page.url contains '/journal/' %} class="active"{% endif %}><i class="fas fa-book" aria-hidden="true"></i> {{ t.nav.journal }}</a>
    <a href="{{ '/' | append: lang | append: '/topics/' | relative_url }}"{% if page.url contains '/topics/' %} class="active"{% endif %}><i class="fas fa-layer-group" aria-hidden="true"></i> {{ t.nav.topics }}</a>
    <a href="{{ '/' | append: lang | append: '/missions/' | relative_url }}"{% if page.url contains '/missions/' %} class="active" aria-current="page"{% endif %}><i class="fas fa-rocket" aria-hidden="true"></i> {{ t.nav.missions }}</a>
    <a href="{{ '/' | append: lang | append: '/downloads/' | relative_url }}"{% if page.url contains '/downloads/' %} class="active" aria-current="page"{% endif %}><i class="fas fa-download" aria-hidden="true"></i> {{ t.nav.downloads }}</a>

    {%- if alt_url != '' %}
    <span class="lang-switch" role="group" aria-label="Language / Lingua">
      {%- if lang == 'it' %}
      <span class="current" aria-current="true">IT</span><a href="{{ alt_url | relative_url }}" hreflang="en" lang="en" data-lang="en">EN</a>
      {%- else %}
      <a href="{{ alt_url | relative_url }}" hreflang="it" lang="it" data-lang="it">IT</a><span class="current" aria-current="true">EN</span>
      {%- endif %}
    </span>
    {%- endif %}
  </nav>
</header>
