<footer class="site-footer">
  <nav class="footer-links" aria-label="Footer">
    <a href="{{ '/' | append: lang | append: '/about/' | relative_url }}"><i class="fas fa-user" aria-hidden="true"></i> {{ t.nav.about }}</a>
    <a href="{{ '/' | append: lang | append: '/contact/' | relative_url }}"><i class="fas fa-envelope" aria-hidden="true"></i> {{ t.nav.contact }}</a>
    {%- if site.data.social.profiles %}
    <span class="footer-follow">{{ site.data.social.title[lang] }}
      {%- for s in site.data.social.profiles %}
      <a href="{{ s.url }}" target="_blank" rel="noopener noreferrer" aria-label="{{ s.name }}" title="{{ s.name }}"><i class="{{ s.icon }} grad-ico" aria-hidden="true"></i></a>
      {%- endfor %}
    </span>
    {%- endif %}
  </nav>
  <style>
  body::before { background-position: center 88%; }
  .grad-ico { background: linear-gradient(to right, #FFD36B, #ff7a22, #d6281a); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
  .footer-follow { display: inline-flex; align-items: center; gap: 0.45rem; color: var(--orange); font-weight: bold; }
  .site-footer .footer-follow a { text-decoration: none; }
  .site-footer .footer-follow i { margin: 0; font-size: 1.1rem; vertical-align: baseline; color: transparent; }
  </style>
  <p class="footer-text">&copy; 2026 Anna Elisabetta Borea &ndash; Redshifted
  <i class="fas fa-satellite" aria-hidden="true"></i></p>
</footer>
